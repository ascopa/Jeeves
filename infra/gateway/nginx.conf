worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    limit_req_zone $http_x_user_id zone=per_user_writes:10m rate=5r/s;
    limit_req_zone $http_x_user_id zone=per_user_reads:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=per_client_search:10m rate=20r/s;
    limit_req_status 429;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_proxied any;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream search_event_service {
        zone search_event_service 64k;
        server search-event-service:8081 resolve;
    }

    upstream booking_service {
        zone booking_service 64k;
        server booking-service:8082 resolve;
    }

    upstream checkout_service {
        zone checkout_service 64k;
        server checkout-service:8083 resolve;
    }

    upstream waiting_room_service {
        zone waiting_room_service 64k;
        server waiting-room-service:8084 resolve;
    }

    server {
        listen 80;
        default_type application/json;
        error_page 429 = @rate_limited;

        location = /search {
            limit_req zone=per_client_search burst=40 nodelay;
            proxy_pass http://search_event_service;
        }

        location ~ ^/events/[^/]+/seats$ {
            limit_req zone=per_user_reads burst=40 nodelay;
            proxy_pass http://booking_service;
        }

        location = /book {
            limit_req zone=per_user_writes burst=10 nodelay;
            proxy_pass http://booking_service;
        }

        location = /checkout {
            limit_req zone=per_user_writes burst=10 nodelay;
            proxy_pass http://checkout_service;
        }

        location /queue/ {
            limit_req zone=per_user_writes burst=10 nodelay;
            proxy_pass http://waiting_room_service;
        }

        location ~ ^/health/(search_event_service|booking_service|checkout_service|waiting_room_service)$ {
            access_log off;
            proxy_pass http://$1/health;
        }

        location @rate_limited {
            add_header Retry-After 1 always;
            return 429 '{"error":"rate_limited"}';
        }

        location / {
            return 404 '{"error":"not found"}';
        }
    }
}
