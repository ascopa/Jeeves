<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img">
  <title>Jeeves architecture</title>
  <desc>The client calls the nginx gateway, which routes to four services in journey order: search-event-service, waiting-room-service, booking-service and checkout-service. booking-service checks the waiting room's admission tokens; checkout-service charges through the card provider and calls the waiting room's internal release endpoint after a sale. The waiting room keeps its queues in Redis, and every service uses PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2c2c2a; }
      .th { font-size: 14px; font-weight: 600; }
      .ts { font-size: 12px; fill: #5f5e5a; }
      .label { font-size: 11px; fill: #6b6a64; }
      .arr { stroke: #6b6a64; stroke-width: 1.2; fill: none; }
      .gray { fill: #f1efe8; stroke: #a8a59a; }
      .purple { fill: #eeedfe; stroke: #7f77dd; }
      .teal { fill: #e1f5ee; stroke: #1d9e75; }
    </style>
  </defs>

  <rect width="840" height="470" fill="#ffffff"/>

  <!-- Client and card provider -->
  <rect class="gray" x="230" y="20" width="160" height="40" rx="8"/>
  <text class="th" x="310" y="45" text-anchor="middle">Client app</text>

  <rect class="gray" x="620" y="20" width="200" height="40" rx="8"/>
  <text class="th" x="720" y="45" text-anchor="middle">card-provider-mock</text>

  <line class="arr" x1="390" y1="40" x2="617" y2="40" marker-end="url(#arrow)"/>
  <text class="label" x="503" y="32" text-anchor="middle">tokenize card</text>

  <!-- Gateway -->
  <rect class="gray" x="20" y="100" width="620" height="40" rx="8"/>
  <text class="th" x="330" y="125" text-anchor="middle">nginx gateway :8080</text>
  <line class="arr" x1="310" y1="60" x2="310" y2="97" marker-end="url(#arrow)"/>

  <!-- Gateway to services -->
  <line class="arr" x1="110" y1="140" x2="110" y2="197" marker-end="url(#arrow)"/>
  <line class="arr" x1="310" y1="140" x2="310" y2="197" marker-end="url(#arrow)"/>
  <line class="arr" x1="560" y1="140" x2="560" y2="197" marker-end="url(#arrow)"/>
  <path class="arr" d="M640 120 L720 120 L720 197" marker-end="url(#arrow)"/>

  <!-- checkout-service charges through the card provider -->
  <line class="arr" x1="795" y1="200" x2="795" y2="63" marker-end="url(#arrow)"/>
  <text class="label" x="788" y="146" text-anchor="end">charge,</text>
  <text class="label" x="788" y="160" text-anchor="end">refund</text>

  <!-- Services, in journey order -->
  <rect class="purple" x="20" y="200" width="180" height="56" rx="8"/>
  <text class="th" x="110" y="222" text-anchor="middle">1. search-event-service</text>
  <text class="ts" x="110" y="242" text-anchor="middle">GET /search</text>

  <rect class="purple" x="220" y="200" width="180" height="56" rx="8"/>
  <text class="th" x="310" y="222" text-anchor="middle">2. waiting-room-service</text>
  <text class="ts" x="310" y="242" text-anchor="middle">/queue/{id}/join · status</text>

  <rect class="purple" x="470" y="200" width="180" height="56" rx="8"/>
  <text class="th" x="560" y="222" text-anchor="middle">3. booking-service</text>
  <text class="ts" x="560" y="242" text-anchor="middle">/events/{id}/seats · /book</text>

  <rect class="purple" x="670" y="200" width="150" height="56" rx="8"/>
  <text class="th" x="745" y="222" text-anchor="middle">4. checkout-service</text>
  <text class="ts" x="745" y="242" text-anchor="middle">POST /checkout</text>

  <!-- Admission tokens: issued by the waiting room, checked by booking -->
  <text class="label" x="435" y="214" text-anchor="middle">admission</text>
  <text class="label" x="435" y="226" text-anchor="middle">token</text>
  <line class="arr" x1="400" y1="238" x2="467" y2="238" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- After a sale, checkout-service frees the buyer's place in the waiting room -->
  <path class="arr" d="M720 256 L720 290 L380 290 L380 259" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="label" x="610" y="283" text-anchor="middle">POST /internal/queue/{id}/release</text>

  <!-- Data -->
  <rect x="10" y="305" width="820" height="155" rx="12" fill="none" stroke="#c9c6bb" stroke-dasharray="4 4"/>
  <text class="ts" x="24" y="324">Data</text>

  <rect class="teal" x="185" y="330" width="130" height="50" rx="8"/>
  <text class="th" x="250" y="351" text-anchor="middle">Redis</text>
  <text class="ts" x="250" y="369" text-anchor="middle">waiting-room queues</text>

  <rect class="teal" x="20" y="405" width="800" height="40" rx="8"/>
  <text class="th" x="420" y="430" text-anchor="middle">PostgreSQL</text>

  <!-- Services to data -->
  <line class="arr" x1="250" y1="256" x2="250" y2="327" marker-end="url(#arrow)"/>
  <line class="arr" x1="110" y1="256" x2="110" y2="402" marker-end="url(#arrow)"/>
  <line class="arr" x1="345" y1="256" x2="345" y2="402" marker-end="url(#arrow)"/>
  <line class="arr" x1="500" y1="256" x2="500" y2="402" marker-end="url(#arrow)"/>
  <line class="arr" x1="800" y1="256" x2="800" y2="402" marker-end="url(#arrow)"/>
</svg>
